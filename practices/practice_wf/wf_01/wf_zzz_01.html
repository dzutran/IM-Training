<html>
<imart type="head">
  <title><imart type="string" value=$data.msg.title /></title>
  <imart type="workflowOpenPageCsjs" />
  <imart type="jsspRpc" name="NodeApi" page="training/dzu/practices/practice_wf/wf_01/api/node_service"
    callback="nodeActionCB" />
  <script src="ui/libs/jquery-validation-1.9.0/jquery.validate.js"></script>
  <imart type="imuiValidationRule" rule="training/dzu/practices/practice_wf/wf_01/wf_zzz_01_validator#rules"
    rulesName="rules" messagesName="messages" />
  <script>
    var pendingPageType = null;

    /**
     * Register Custom Validation Rules
     */
    function registerCustomRules() {
      imuiAddValidationRule('noSecret', function(val, el, param) {
        if (val === '') return true;
        return val.toLowerCase().indexOf('secret') === -1;
      });

      imuiAddValidationRule('notNegative', function(val, el, param) {
        if (val === '') return true;
        return parseFloat(val) >= 0;
      });

      imuiAddValidationRule('maxThirty', function(val, el, param) {
        if (val === '') return true;
        return parseFloat(val) <= 30;
      });
    }

    /**
     * Standard IMUI Validation Trigger (Client-side)
     */
    function validateStandard() {
      // 1. Define custom rules (Mirroring the validator file for client-side autonomy)
      var customRules = {
        'leave_reason': {
          required: true,
          maxlength: 200,
          noSecret: true
        },
        'leave_days': {
          required: true,
          numeric: true,
          digits: [2, 1],
          min: 0.5,
          maxThirty: true,
          notNegative: true
        },
        'item_total': {
          number: true,
          min: 0,
          max: 1000000,
          notNegative: true
        }
      };

      // 2. Define custom messages to override EVERYTHING
      var customMessages = {
        'leave_reason': {
          'required': 'zzz Please enter the reason for your leave!',
          'maxlength': 'zzz Reason is too long (max 200 chars)!',
          'noSecret': 'zzz Reasons cannot contain prohibited words like "secret"!'
        },
        'leave_days': {
          'required': 'zzz How many days do you need?',
          'numeric': 'zzz Leave days must be a number!',
          'min': 'zzz Minimum leave is 0.5 days!',
          'digits': 'zzz Please enter up to 2 digits and 1 decimal place!',
          'maxThirty': 'zzz You cannot apply for more than 30 days at once!',
          'notNegative': 'zzz This value cannot be negative!'
        },
        'item_total': {
          'number': 'zzz Item total must be a valid number!',
          'min': 'zzz Item total cannot be less than 0!',
          'max': 'zzz Item total cannot exceed 1,000,000!',
          'notNegative': 'zzz This value cannot be negative!'
        }
      };

      return imuiValidate('#workflowOpenPageForm', customRules, customMessages);
    }

    /**
     * Triggers the RPC call to get node configuration and proceeds to transition.
     */
    function triggerNodeSettingRpc(pageType) {
      pendingPageType = pageType;

      var inputData = {
        leave_days: $('input[name="leave_days"]').val(),
        item_total: $('input[name="item_total"]').val()
      };

      // Proceed directly to getting node settings (Client-side validation has passed)
      NodeApi.getNodeSetting(inputData);
    }

    /**
     * RPC Callback Handler
     */
    function nodeActionCB(res) {
      if (res.error) {
        imuiShowErrorMessage(res.message || "System error occurred.");
        return;
      }

      if (res.type === 'getNodeSetting') {
        if (res.data) {
          var nodeSettingJson = ImJson.toJSONString(res.data);
          var $form = $("#workflowOpenPageForm");
          if ($form.find('input[name="imwNodeSetting"]').length === 0) {
            $form.append('<input type="hidden" name="imwNodeSetting" />');
          }
          $form.find('input[name="imwNodeSetting"]').val(nodeSettingJson);

          // Proceed with workflow operation
          if (pendingPageType !== null) {
            imuiResetForm('#workflowOpenPageForm');
            workflowOpenPage(pendingPageType);
            pendingPageType = null;
          }
        } else {
          imuiShowErrorMessage("Error: Could not retrieve node configuration.");
        }
      }
    }

    /**
     * Light Validation for Temporary Save
     */
    function validateTempSave() {
      var tempRules = {
        'leave_reason': { maxlength: 200 },
        'leave_days': { numeric: true, digits: [2, 1], notNegative: true },
        'item_total': { number: true, max: 1000000, notNegative: true }
      };

      var tempMessages = {
        'leave_reason': { 'maxlength': 'zzz Reason is too long even for a draft!' },
        'leave_days': { 'numeric': 'zzz Must be a number!', 'notNegative': 'zzz No negative days!' },
        'item_total': { 'number': 'zzz Must be a number!', 'notNegative': 'zzz No negative total!' }
      };

      return imuiValidate('#workflowOpenPageForm', tempRules, tempMessages);
    }

    $(function () {
      // 1. Initialize Custom Rules
      registerCustomRules();

      // 2. Prevent double submission
      imuiDisableOnSubmit('#workflowOpenPageForm');

      $('#back').click(function () {
        $('#workflowOpenPageForm').attr('action', 'training/dzu/practices/practice_wf/wf_01/wf_zzz_01');
        $('#workflowOpenPageForm').submit();
        return false;
      });

      $('#openPage0').click(function () {
        if (!validateStandard()) return false;
        triggerNodeSettingRpc('0');
        return false;
      });

      $('#openPage1').click(function () {
        if (!validateTempSave()) return false;
        workflowOpenPage('1');
        return false;
      });

      $('#openPage2').click(function () {
        if (!validateStandard()) return false;
        triggerNodeSettingRpc('2');
        return false;
      });

      $('#openPage3').click(function () {
        if (!validateStandard()) return false;
        triggerNodeSettingRpc('3');
        return false;
      });

      $('#openPage4').click(function () {
        if (!validateStandard()) return false;
        triggerNodeSettingRpc('4');
        return false;
      });
    });

  </script>
</imart>

<imart type="workflowOpenPage" name="workflowOpenPageForm" id="workflowOpenPageForm" method="POST" target="_top"
  imwUserDataId=$data.imwUserDataId imwSystemMatterId=$data.imwSystemMatterId imwAuthUserCode=$data.imwAuthUserCode
  imwApplyBaseDate=$data.imwApplyBaseDate imwNodeId=$data.imwNodeId imwFlowId=$data.imwFlowId
  imwCallOriginalParams=$data.imwCallOriginalParams imwNextScriptPath=$data.imwCallOriginalPagePath>

  <div class="imui-form-container-wide">
    <div class="imui-chapter-title">
      <h2><imart type="string" value=$data.msg.title /></h2>
    </div>

    <div style="margin-bottom: 20px;">
      <imart type="imuiButton" value=$data.msg.btnBack id="back" name="back" class="imui-medium-button" />
    </div>

    <table class="imui-form">
      <tbody>
        <tr>
          <th><label class="imui-required"><imart type="string" value=$data.msg.capReason /></label></th>
          <td>
            <imart type="imuiTextArea" name="leave_reason" value=$data.leave_reason style="width: 400px; height: 100px;"
              placeholder="Enter leave reason..." />
          </td>
        </tr>
        <tr>
          <th><label class="imui-required"><imart type="string" value=$data.msg.capDays /></label></th>
          <td>
            <imart type="imuiTextbox" name="leave_days" value=$data.leave_days style="width: 100px;" />
            <span
              style="display: inline-block; margin-left: 15px; padding: 2px 8px; background-color: #e7f3ff; border: 1px solid #b3d7ff; color: #004085; border-radius: 4px; font-weight: bold; font-size: 0.85em;">
              <span class="im-ui-icon-common-16-info"
                style="display: inline-block; vertical-align: middle; margin-top: -3px;"></span>
              Rules: &lt;3d: dev07 | 3-6d: dev08 | &ge;7d: dev03
            </span>
          </td>
        </tr>
        <tr>
          <th><label><imart type="string" value=$data.msg.capTotal /></label></th>
          <td>
            <imart type="imuiTextbox" name="item_total" value=$data.item_total style="width: 100px;" />
            <span
              style="display: inline-block; margin-left: 15px; padding: 2px 8px; background-color: #fff3e0; border: 1px solid #ffe0b2; color: #e65100; border-radius: 4px; font-weight: bold; font-size: 0.85em;">
              <span class="im-ui-icon-common-16-info"
                style="display: inline-block; vertical-align: middle; margin-top: -3px;"></span>
              Expansion: Default: dev08 | >50k: 3 users | >100k: 5 users
            </span>
          </td>
        </tr>
        <tr>
          <th><label><imart type="string" value=$data.msg.capStatus /></label></th>
          <td>
            <imart type="imuiTextbox" value=$data.status readonly class="imui-text-readonly" />
          </td>
        </tr>
      </tbody>
    </table>

    <div class="imui-chapter-title" style="margin-top: 20px;">
      <h2><imart type="string" value=$data.msg.capSysInfo /></h2>
    </div>

    <table class="imui-form">
      <tbody>
        <tr>
          <th><label><imart type="string" value=$data.msg.capPageType /></label></th>
          <td>
            <imart type="imuiTextbox" value=$data.imwPageType readonly class="imui-text-readonly" />
          </td>
        </tr>
        <tr>
          <th><label><imart type="string" value=$data.msg.capUserDataId /></label></th>
          <td>
            <imart type="imuiTextbox" value=$data.imwUserDataId readonly class="imui-text-readonly" />
          </td>
        </tr>
        <tr>
          <th><label><imart type="string" value=$data.msg.capFlowId /></label></th>
          <td>
            <imart type="imuiTextbox" value=$data.imwFlowId readonly class="imui-text-readonly" />
          </td>
        </tr>
      </tbody>
    </table>

    <div class="imui-operation-parts">
      <imart type="decision" case="0" value=$data.imwPageType>
        <imart type="imuiButton" value=$data.msg.btnApply id="openPage0" name="openPage0" class="imui-large-button" />
        <imart type="imuiButton" value=$data.msg.btnTemp id="openPage1" name="openPage1" class="imui-large-button" />
      </imart>
      <imart type="decision" case="1" value=$data.imwPageType>
        <imart type="imuiButton" value=$data.msg.btnApply id="openPage0" name="openPage0" class="imui-large-button" />
        <imart type="imuiButton" value=$data.msg.btnTemp id="openPage1" name="openPage1" class="imui-large-button" />
      </imart>
      <imart type="decision" case="2" value=$data.imwPageType>
        <imart type="imuiButton" value=$data.msg.btnApply id="openPage2" name="openPage2" class="imui-large-button" />
      </imart>
      <imart type="decision" case="3" value=$data.imwPageType>
        <imart type="imuiButton" value=$data.msg.btnApply id="openPage3" name="openPage3" class="imui-large-button" />
      </imart>
      <imart type="decision" case="4" value=$data.imwPageType>
        <imart type="imuiButton" value=$data.msg.btnProcess id="openPage4" name="openPage4" class="imui-large-button" />
      </imart>
    </div>
  </div>
</imart>

</html>
