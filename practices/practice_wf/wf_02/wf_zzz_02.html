<html>
<imart type="head">
  <title>
    <imart type="string" value=$data.msg.title />
  </title>

  <style type="text/css">
    /* Chỉ giữ lại các style cần thiết cho logic hiển thị, loại bỏ trang trí hiện đại */
    .im-workflow-highlight-row {
      background-color: #fff0f0 !important;
      /* Màu highlight đỏ nhạt chuẩn workflow */
    }

    .status-hot-text {
      color: #ff0000;
      font-weight: bold;
    }
  </style>

  <imart type="jsspRpc" name="monitorApi" page="training/dzu/practices/practice_wf/wf_02/api/monitor"
    callback="monitorActionCB" />

  <script type="text/javascript">
    function monitorActionCB(res) {
      if (res.type === 'getList') {
        if (res.error) {
          imuiAlert(res.message);
          return;
        }
        $("#matterTable").clearGridData().setGridParam({ data: res.data }).trigger("reloadGrid");
      }
    }

    function onGridComplete() {
      var $grid = $(this);
      var ids = $grid.jqGrid('getDataIDs');

      for (var i = 0; i < ids.length; i++) {
        var rowId = ids[i];
        var rowData = $grid.jqGrid('getRowData', rowId);

        // Highlight approval node zzz_approve_01
        if (rowData.node_id === 'zzz_approve_01') {
          $grid.find('#' + rowId).addClass('im-workflow-highlight-row');
          // Highlight node_id and matter_name with standard classes or simple styles
          $grid.setCell(rowId, 'node_id', '<span class="status-hot-text">' + rowData.node_id + '</span>');
          $grid.setCell(rowId, 'matter_name', '🚩 ' + rowData.matter_name);
        }
      }
    }

    /**
     * Declarative attribute provider for jqGrid columns
     */
    function cellAttrProvider(rowId, val, rawObject, cm, rdata) {
      return 'style="color: #0066cc; text-decoration: underline; cursor: pointer;"';
    }

    /**
     * Unified Cell Selection Handler (RESTful Standards)
     */
    function onCellSelect(rowid, iCol, cellcontent, e) {
      var $grid = $(this);
      var colModel = $grid.jqGrid('getGridParam', 'colModel');
      var colName = colModel[iCol].name;
      var rowData = $grid.jqGrid('getRowData', rowid);

      if (colName === 'flow_link') {
        // Open Flow Information Popup
        openFlowPopup(rowData.system_matter_id);
      } else if (colName === 'system_matter_id') {
        // Open Workflow Processing Screen directly (RESTful)
        var url = 'im_workflow/user/process/process_direct/' + rowData.system_matter_id + '/' + rowData.node_id;
        window.open(url, '_blank');
      }
    }

    /**
     * Opens the Flow Information screen in a professional popup window
     */
    function openFlowPopup(systemMatterId) {
      if (!systemMatterId) return;

      var url = 'im_workflow/matters/' + systemMatterId + '/flow-info';
      var w = 1100;
      var h = 800;
      var left = (screen.width / 2) - (w / 2);
      var top = (screen.height / 2) - (h / 2);

      window.open(url, 'FlowInfoPopup', 'width=' + w + ',height=' + h + ',top=' + top + ',left=' + left + ',resizable=yes,scrollbars=yes,status=no');
    }

    function onSearch() {
      var flowId = $("#searchFlowId").val();
      monitorApi.getList({ flowId: flowId });
    }

    function onApplyNew() {
      var flowId = $("#searchFlowId").val();
      if (!flowId) {
        imuiAlert($data.msg.errNoFlow);
        return;
      }
      var url = 'im_workflow/common/switch/switch_content?' +
        'imwPageType=0' +
        '&imwFlowId=' + flowId +
        '&imwCallOriginalPagePath=training/dzu/practices/practice_wf/wf_02/wf_zzz_02';
      window.open(url, '_blank');
    }
  </script>
</imart>

<div class="imui-title">
  <h1>
    <imart type="string" value=$data.msg.title />
  </h1>
</div>

<imui-container-main>
  <!-- Search Area (Standard imuiForm) -->
  <div class="imui-form-container-wide">
    <div class="imui-chapter-title">
      <h2>
        <imart type="string" value=$data.msg.capSearch />
      </h2>
    </div>
    <table class="imui-form">
      <tr>
        <th width="15%"><label>
            <imart type="string" value=$data.msg.capFlowId />
          </label></th>
        <td width="35%">
          <input type="text" id="searchFlowId" value="wf_zzz_01" />
        </td>
        <td class="align-right">
          <imart type="imuiButton" id="searchBtn" label=$data.msg.btnSearch class="imui-button" onclick="onSearch()" />
        </td>
      </tr>
    </table>
  </div>

  <br />

  <!-- List Area -->
  <div class="imui-form-container-wide">
    <div class="imui-chapter-title">
      <h2>
        <imart type="string" value=$data.msg.capList />
      </h2>
    </div>

    <!-- Toolbar Area -->
    <div class="imui-toolbar-wrap">
      <div class="imui-toolbar">
        <ul>
          <li>
            <imart type="imuiButton" id="applyBtn" label=$data.msg.btnApply iconClass="im-ui-icon-common-16-edit"
              onclick="onApplyNew()" />
          </li>
          <li>
            <imart type="imuiButton" id="refreshBtn" label=$data.msg.btnRefresh iconClass="im-ui-icon-common-16-refresh"
              onclick="onSearch()" />
          </li>
        </ul>
      </div>
    </div>

    <imart type="imuiListTable" id="matterTable" data=$data.matters height="400" rowNumbers="true"
      onGridComplete="onGridComplete" onCellSelect="onCellSelect" autoWidth="true" shrinkToFit="true">
      <cols>
        <col name="flow_link" caption=$data.msg.capFlowInfo width="40" align="center" sortable="false" onCellAttr="cellAttrProvider">
          <showIcon iconClass="im-ui-icon-common-16-information" />
        </col>
        <col name="system_matter_id" caption=$data.msg.capId width="180" align="center" onCellAttr="cellAttrProvider" />
        <col name="matter_name" caption=$data.msg.capName width="300" />
        <col name="node_id" caption=$data.msg.capNode width="160" align="center" />
        <col name="apply_user_name" caption=$data.msg.capUser width="160" />
        <col name="apply_date" caption=$data.msg.capDate width="200" align="center" />

        <col name="user_data_id" hidden />
        <col name="flow_id" hidden />
        <col name="page_type" hidden />
      </cols>
    </imart>
  </div>
</imui-container-main>

</html>
