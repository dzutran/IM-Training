<html>
<imart type="head">
  <title>Workflow Monitor (Standard UI)</title>

  <style type="text/css">
    /* Chỉ giữ lại các style cần thiết cho logic hiển thị, loại bỏ trang trí hiện đại */
    .im-workflow-highlight-row {
      background-color: #fff0f0 !important;
      /* Màu highlight đỏ nhạt chuẩn workflow */
    }

    .status-hot-text {
      color: #ff0000;
      font-weight: bold;
    }
  </style>

  <imart type="jsspRpc" name="monitorApi" page="training/dzu/practices/practice_wf/wf_02/api/monitor"
    callback="monitorActionCB" />

  <script type="text/javascript">
    function monitorActionCB(res) {
      if (res.type === 'getList') {
        if (res.error) {
          imuiAlert(res.message);
          return;
        }
        $("#matterTable").clearGridData().setGridParam({ data: res.data }).trigger("reloadGrid");
      }
    }

    function onGridComplete() {
      var $grid = $(this);
      var ids = $grid.jqGrid('getDataIDs');

      for (var i = 0; i < ids.length; i++) {
        var rowId = ids[i];
        var rowData = $grid.jqGrid('getRowData', rowId);

        var url = 'im_workflow/common/switch/switch_content?' +
          'imwSystemMatterId=' + rowData.system_matter_id +
          '&imwUserDataId=' + rowData.user_data_id +
          '&imwNodeId=' + rowData.node_id +
          '&imwPageType=' + rowData.page_type +
          '&imwFlowId=' + rowData.flow_id +
          '&imwCallOriginalPagePath=training/dzu/practices/practice_wf/wf_02/wf_zzz_02';

        var linkHtml = '<a href="' + url + '" target="_blank">' + rowData.system_matter_id + '</a>';
        $grid.setCell(rowId, 'system_matter_id', linkHtml);

        if (rowData.node_id === 'zzz_approve_01') {
          $grid.find('#' + rowId).addClass('im-workflow-highlight-row');
          $grid.setCell(rowId, 'node_id', '<span class="status-hot-text">' + rowData.node_id + '</span>');
          $grid.setCell(rowId, 'matter_name', '🚩 ' + rowData.matter_name);
        }
      }
    }

    function onSearch() {
      var flowId = $("#searchFlowId").val();
      monitorApi.getList({ flowId: flowId });
    }

    function onApplyNew() {
      var flowId = $("#searchFlowId").val();
      if (!flowId) {
        imuiAlert("Please enter a Flow ID first.");
        return;
      }
      var url = 'im_workflow/common/switch/switch_content?' +
        'imwPageType=0' +
        '&imwFlowId=' + flowId +
        '&imwCallOriginalPagePath=training/dzu/practices/practice_wf/wf_02/wf_zzz_02';
      window.open(url, '_blank');
    }
  </script>
</imart>

<div class="imui-title">
  <h1>Workflow Monitor</h1>
</div>

<imui-container-main>
  <!-- Search Area (Standard imuiForm) -->
  <div class="imui-form-container-wide">
    <div class="imui-chapter-title">
      <h2>Search Condition</h2>
    </div>
    <table class="imui-form">
      <tr>
        <th width="15%"><label>Flow ID</label></th>
        <td width="35%">
          <input type="text" id="searchFlowId" value="wf_zzz_01" />
        </td>
        <td class="align-right">
          <imart type="imuiButton" id="searchBtn" label="Search" class="imui-button" onclick="onSearch()" />
        </td>
      </tr>
    </table>
  </div>

  <br />

  <!-- List Area -->
  <div class="imui-form-container-wide">
    <div class="imui-chapter-title">
      <h2>Matter List</h2>
      <div class="imui-operation-parts">
        <imart type="imuiButton" id="applyBtn" label="Apply New" iconClass="im-ui-icon-common-16-edit"
          class="imui-button imui-operation-parts-button" onclick="onApplyNew()" />
      </div>
    </div>

    <imart type="imuiListTable" id="matterTable" data=$data.matters height="400" rowNumbers="true"
      onGridComplete="onGridComplete" autoWidth="true" shrinkToFit="true">
      <cols>
        <col name="system_matter_id" caption="System ID" width="180" align="center" />
        <col name="matter_name" caption="Matter Descriptor" width="300" />
        <col name="node_id" caption="Node Phase" width="160" align="center" />
        <col name="apply_user_name" caption="Initiated By" width="160" />
        <col name="apply_date" caption="Timeline" width="200" align="center" />

        <col name="user_data_id" hidden />
        <col name="flow_id" hidden />
        <col name="page_type" hidden />
      </cols>
    </imart>
  </div>
</imui-container-main>

</html>
